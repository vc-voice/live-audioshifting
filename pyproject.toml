[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxshift"
version = "0.1.0"
description = "Live voice, accent and language changer built on open-source models (Whisper, Argos Translate, Piper)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "sounddevice",
  "faster-whisper",
  "argostranslate",
  "piper-tts",
  "gradio>=4.40",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
voxshift = "voxshift.cli:main"

[tool.setuptools]
packages = ["voxshift"]
